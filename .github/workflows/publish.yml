name: Publish

# Publishes to npm over OIDC trusted publishing — no token, no 2FA prompt.
# Configure once on npmjs.com: package settings -> Trusted Publisher ->
# GitHub Actions, repository Cryptoteep/llm-prices, workflow publish.yml
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or commit to publish"
        required: true
        default: main

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1+
      - run: npm install -g npm@latest
      - run: npm test
      - run: npm publish --provenance --access public
