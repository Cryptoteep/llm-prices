name: Refresh prices

# Weekly pull of LiteLLM's pricing dataset. When prices changed and the test
# suite still passes, bump the patch version, commit, tag and publish.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to npm if data changed"
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Regenerate dataset
        run: npm run update-prices

      - name: Detect price changes
        id: diff
        run: |
          # ignore a lone `updated:` stamp — that changes on every run
          if git diff --quiet -- data/prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$(git diff -U0 -- data/prices.json | grep -cE '^[+-][^+-]' || true)" -le 2 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- data/prices.json
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/prices.json
          fi

      - name: Test against the new data
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Commit, tag and publish
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.publish)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch -m "data: refresh prices (%s)"
          git push --follow-tags
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --provenance --access public
          else
            echo "::warning::NPM_TOKEN not set — data committed but not published"
          fi

      - name: Commit only (manual run without publish)
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'workflow_dispatch' && !inputs.publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "data: refresh prices"
          git push
