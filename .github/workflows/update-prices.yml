name: Refresh prices

# Weekly pull of LiteLLM's pricing dataset. When prices changed and the test
# suite still passes, bump the patch version and push the tag — the tag fires
# publish.yml, which releases to npm over trusted publishing.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:
    inputs:
      release:
        description: "Tag a patch release if data changed"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate dataset
        run: npm run update-prices

      - name: Detect price changes
        id: diff
        run: |
          # ignore a lone `updated:` stamp — that changes on every run
          if git diff --quiet -- data/prices.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif [ "$(git diff -U0 -- data/prices.json | grep -cE '^[+-][^+-]' || true)" -le 2 ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            git checkout -- data/prices.json
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/prices.json
          fi

      - name: Test against the new data
        if: steps.diff.outputs.changed == 'true'
        run: npm test

      - name: Commit and tag a patch release
        if: steps.diff.outputs.changed == 'true' && (github.event_name == 'schedule' || inputs.release)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version patch -m "data: refresh prices (%s)"
          git push --follow-tags

      - name: Commit only
        if: steps.diff.outputs.changed == 'true' && github.event_name == 'workflow_dispatch' && !inputs.release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "data: refresh prices"
          git push
